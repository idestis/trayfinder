name: PR

# Squash merges use the PR title as the commit message, and git-cliff builds the changelog and
# release notes from those, so the title must be a Conventional Commit. Labels are added automatically.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    runs-on: ubuntu-24.04
    steps:
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: [^A-Z].+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat(palette): open items behind the overflow arrow' (got: $TITLE)"
            exit 1
          fi

  label:
    runs-on: ubuntu-24.04
    steps:
      # Area labels from changed paths (.github/labeler.yml). Runs on the base branch's config only.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
      # Type label from the title prefix.
      - uses: actions/github-script@v9
        env:
          TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const types = { feat: 'feature', fix: 'bug', perf: 'performance', refactor: 'refactor',
              docs: 'docs', test: 'test', build: 'build', ci: 'ci', chore: 'chore', style: 'chore', revert: 'revert' };
            const m = /^(\w+)(\([^)]*\))?(!)?:/.exec(process.env.TITLE || '');
            const wanted = new Set();
            if (m && types[m[1]]) wanted.add(types[m[1]]);
            if (m && m[3]) wanted.add('breaking');
            const pr = context.payload.pull_request;
            const current = pr.labels.map(l => l.name);
            const managed = new Set([...Object.values(types), 'breaking']);
            for (const name of current) {
              if (managed.has(name) && !wanted.has(name) && !['docs', 'ci'].includes(name)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name }).catch(() => {});
              }
            }
            const add = [...wanted].filter(n => !current.includes(n));
            if (add.length) await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: add });
