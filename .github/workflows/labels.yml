name: Labels

# Adds area labels (from changed paths, .github/labeler.yml) and a type label (from the title prefix).
# pull_request_target so it can label PRs from forks; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
      - uses: actions/github-script@v7
        env:
          TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const types = { feat: 'feature', fix: 'bug', perf: 'performance', refactor: 'refactor',
              docs: 'docs', test: 'test', build: 'build', ci: 'ci', chore: 'chore', style: 'chore', revert: 'revert' };
            const m = /^(\w+)(\([^)]*\))?(!)?:/.exec(process.env.TITLE || '');
            const wanted = new Set();
            if (m && types[m[1]]) wanted.add(types[m[1]]);
            if (m && m[3]) wanted.add('breaking');
            const pr = context.payload.pull_request;
            const current = pr.labels.map(l => l.name);
            // Only type labels are managed here; docs and ci double as area labels, so leave those to labeler.
            const managed = new Set(['feature', 'bug', 'performance', 'refactor', 'test', 'build', 'chore', 'revert', 'breaking']);
            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name }).catch(() => {});
              }
            }
            const add = [...wanted].filter(n => !current.includes(n));
            if (add.length) await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: add });
