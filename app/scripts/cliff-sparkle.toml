# git-cliff config used to render release notes for the Sparkle appcast.
# Sparkle renders <description> as HTML, so the body template emits HTML
# (h3 + ul + li + strong) instead of markdown. No version header — the
# appcast item already carries <sparkle:shortVersionString>.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
<h3>{{ group | upper_first }}</h3>
<ul>
{% for commit in commits -%}
<li>{% if commit.scope %}<strong>{{ commit.scope }}:</strong> {% endif %}{{ commit.message | upper_first }}</li>
{% endfor -%}
</ul>
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9].*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
topo_order = false

# Skip release chores so they never appear in the in-app updater.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Style" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "CI" },
    { message = "^build", group = "Build" },
    { message = "^chore", group = "Chore" },
    { message = "^revert", group = "Reverts" },
]
