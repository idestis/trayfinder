# git-cliff config used to render release notes for the Sparkle appcast.
# Sparkle renders <description> as HTML, so the body template emits HTML
# (h3 + ul + li + strong) instead of markdown. No version header — the
# appcast item already carries <sparkle:shortVersionString>.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") -%}
<h3>{{ group | upper_first }}</h3>
<ul>
{% for commit in commits -%}
<li>{{ commit.message | upper_first }}</li>
{% endfor -%}
</ul>
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
tag_pattern = "^v[0-9].*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
topo_order = false

commit_preprocessors = [
  { pattern = '\s*\(#[0-9]+\)', replace = "" },
]

# Only what a user notices, same as the GitHub release notes (cliff-release.toml).
commit_parsers = [
    { message = "^[a-z]+\\((landing|ci|docs|release|deps)\\)", skip = true },
    { message = "^feat", group = "New" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Faster" },
]
