# XcodeGen spec. `task gen` writes Trayfinder.xcodeproj (gitignored); edit this file, not the project.
name: Trayfinder
options:
  bundleIdPrefix: io.github.idestis
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Trayfinder:
    type: application
    platform: macOS
    sources: [Trayfinder]
    settings:
      base:
        PRODUCT_NAME: Trayfinder
        INFOPLIST_FILE: Trayfinder/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Trayfinder/Resources/Trayfinder.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: Sparkle
  TrayfinderTests:
    type: bundle.unit-test
    platform: macOS
    # Not hosted: pure logic is compiled straight into the bundle, so tests never launch the app
    # (which would touch the real menu bar) and run in about a second.
    sources:
      - TrayfinderTests
      - Trayfinder/Core
      - Trayfinder/Support
      - Trayfinder/Settings/Preferences.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.idestis.trayfinder.tests
schemes:
  Trayfinder:
    build:
      targets:
        Trayfinder: all
        TrayfinderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [TrayfinderTests]
    archive:
      config: Release
